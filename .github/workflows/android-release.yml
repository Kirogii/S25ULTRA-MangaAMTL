name: Android release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to rebuild and publish
        default: v1.0.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore verified build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --pattern build-inputs.zip --repo "$GITHUB_REPOSITORY"
          sha256sum --check android/build-inputs.sha256
          unzip -q build-inputs.zip -d android
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore APK signing identity
        env:
          APK_KEYSTORE: ${{ secrets.APK_KEYSTORE }}
        run: |
          test -n "$APK_KEYSTORE"
          mkdir -p ~/.android
          printf '%s' "$APK_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
      - name: Build and lint APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          chmod +x android/gradlew
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          android/gradlew -p android :app:assembleDebug :app:lintDebug -PbuildPython="$(which python)" -PbundleOcr=false -PbundleInpainting=false -PbundleTranslation=false -PreleaseVersion="$VERSION"
      - name: Verify model-free APK
        run: python android/verify_model_free_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Package release
        run: |
          mkdir release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/S25ULTRA-MangaAMTL.apk
          cd Extension && zip -r ../release/S25ULTRA-MangaAMTL-Extension.zip . -x '*.zip' '__pycache__/*' && cd ..
          (cd release && sha256sum S25ULTRA-* > SHA256SUMS.txt)
          cat android/build-inputs.sha256 >> release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: S25ULTRA-MangaAMTL
          path: release/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
